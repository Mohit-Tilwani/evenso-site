<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evenso · coming soon</title>
<meta name="description" content="Your day and your people, in one calm place. Evenso is coming soon to Android.">
<link rel="canonical" href="https://evenso.me/">
<meta name="theme-color" content="#0F1318" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F6F7F9" media="(prefers-color-scheme: light)">
<meta property="og:type" content="website">
<meta property="og:title" content="Evenso · coming soon">
<meta property="og:description" content="Your day and your people, in one calm place.">
<meta property="og:url" content="https://evenso.me/">
<meta property="og:image" content="https://evenso.me/img/feature.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/img/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Fira+Sans:wght@500&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
.soonpage{min-height:100vh;display:flex;flex-direction:column}
.soon-main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 56px 64px}
.soon-box{max-width:44em;width:100%;text-align:center}
.soon-box h1{font:700 52px/1.12 "Bricolage Grotesque",Figtree,sans-serif;letter-spacing:-.015em;margin:0 0 36px}
.soon-box .lede2{font-size:18px;color:var(--muted);margin:0 0 32px}
.signup{display:flex;gap:10px;max-width:30em;margin:0 auto}
.signup input[type=email]{flex:1;min-width:0;min-height:50px;padding:0 18px;border-radius:25px;border:1px solid var(--line);background:var(--surf);color:var(--text);font:16px Figtree,system-ui,sans-serif}
.signup input[type=email]:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.signup button{min-height:50px;padding:0 24px;border-radius:25px;border:0;background:var(--tealf);color:#fff;font:600 16px Figtree,system-ui,sans-serif;cursor:pointer}
.signup button:hover{filter:brightness(1.08)}
.signup button:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.soon-fine{font-size:14px;color:var(--faint);margin:16px 0 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:640px){.soon-main{padding:24px 20px 48px}.soon-box h1{font-size:36px}.signup{flex-direction:column}.signup button{width:100%}}
</style>
</head>
<body>
<div class="wrap soonpage">
<header class="nav"><a class="brand" href="/" aria-label="Evenso home"><span class="mark" aria-hidden="true"></span><span class="word">evenso</span></a></header>
<main class="soon-main">
<div class="soon-box">
<h1>Your day and your people, in one calm place.</h1>
<form class="signup" action="https://formsubmit.co/hello@evenso.me" method="POST">
<label class="sr" for="email">Your email</label>
<input id="email" type="email" name="email" required autocomplete="email" placeholder="you@example.com">
<input type="hidden" name="_subject" value="New Evenso tester sign-up">
<input type="hidden" name="_template" value="table">
<input type="hidden" name="_captcha" value="false">
<input type="hidden" name="_next" value="https://evenso.me/thanks/">
<input class="hp" type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">
<button type="submit">Sign me up</button>
</form>
<p class="soon-fine">Sign up to test it early. We'll only email you about testing.</p>
</div>
</main>
<footer class="foot"><span>© 2026 Evenso</span><nav aria-label="Footer"><a href="/privacy/">Privacy</a><a href="/terms/">Terms</a><a href="mailto:hello@evenso.me">hello@evenso.me</a></nav></footer>
</div>
</body>
</html>
